name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  contract:
    # The cards against the real Heating Manager integration on Home Assistant:
    # the oldest supported version and the latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        heating_manager: [v3.2.0, main]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vatons/heating_manager
          ref: ${{ matrix.heating_manager }}
          path: heating_manager
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.14 .venv && uv pip install --python .venv/bin/python -r contract/requirements.txt
      - run: ../.venv/bin/pytest
        working-directory: contract
        env:
          HM_BACKEND: ${{ github.workspace }}/heating_manager

  e2e:
    # The cards in Home Assistant 2026.10 with its frontend, in Chromium,
    # against the oldest supported Heating Manager and the latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        heating_manager: [v3.2.0, main]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vatons/heating_manager
          ref: ${{ matrix.heating_manager }}
          path: heating_manager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.14 .venv-e2e && uv pip install --python .venv-e2e/bin/python -r e2e/requirements.txt
      - run: npm run test:e2e
        env:
          HA_PYTHON: .venv-e2e/bin/python
          HM_BACKEND: ${{ github.workspace }}/heating_manager
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-${{ matrix.heating_manager }}
          path: e2e/screenshots/
