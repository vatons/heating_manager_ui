# Example dashboard configurations for the Heating Manager cards.
# Entity IDs follow Heating Manager 3.x naming: climate.<zone> and climate.<zone>_<room>.
# Every option here can also be set in the cards' visual editors.

# ================================================================
# EXAMPLE 1: A room
# ================================================================
type: custom:heating-room-card
entity: climate.downstairs_lounge

# ================================================================
# EXAMPLE 2: A room with a custom name and a 1-hour boost (instead of the room's own boost duration)
# ================================================================
type: custom:heating-room-card
entity: climate.upstairs_bedroom
name: Main bedroom
boost_duration: 60

# ================================================================
# EXAMPLE 3: Just the temperature and status (no Boost button or analytics)
# ================================================================
type: custom:heating-room-card
entity: climate.downstairs_kitchen
show_controls: false
show_analytics: false

# ================================================================
# EXAMPLE 4: A zone with all of its rooms
# ================================================================
type: custom:heating-zone-card
entity: climate.downstairs

# ================================================================
# EXAMPLE 5: A zone with chosen rooms, in this order
# ================================================================
type: custom:heating-zone-card
entity: climate.upstairs
name: Bedrooms
rooms:
  - climate.upstairs_main_bedroom
  - climate.upstairs_guest_bedroom

# ================================================================
# EXAMPLE 6: The whole house (heating demand and Boost all; away mode in its dialog)
# ================================================================
type: custom:heating-room-card
entity: climate.heating_manager
name: Whole house

# ================================================================
# EXAMPLE 7: A sections view: the house, then one section per zone
# ================================================================
title: Heating
path: heating
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: heading
        heading: Home
      - type: custom:heating-room-card
        entity: climate.heating_manager
        grid_options:
          columns: 12
  - type: grid
    cards:
      - type: custom:heating-zone-card
        entity: climate.downstairs
  - type: grid
    cards:
      - type: custom:heating-zone-card
        entity: climate.upstairs

# ================================================================
# EXAMPLE 8: Room cards in a grid
# ================================================================
type: grid
columns: 2
square: false
cards:
  - type: custom:heating-room-card
    entity: climate.downstairs_lounge
  - type: custom:heating-room-card
    entity: climate.downstairs_kitchen
  - type: custom:heating-room-card
    entity: climate.upstairs_bedroom
  - type: custom:heating-room-card
    entity: climate.upstairs_office

# ================================================================
# EXAMPLE 9: Tap for the zone's dashboard, hold for details
# ================================================================
type: custom:heating-room-card
entity: climate.downstairs
tap_action:
  action: navigate
  navigation_path: /lovelace/downstairs
hold_action:
  action: more-info

# ================================================================
# EXAMPLE 10: Show a room only while it's heating
# ================================================================
type: conditional
conditions:
  - condition: state
    entity: climate.downstairs_lounge
    attribute: hvac_action
    state: heating
card:
  type: custom:heating-room-card
  entity: climate.downstairs_lounge
